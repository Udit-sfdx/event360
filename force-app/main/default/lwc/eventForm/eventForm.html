<template>
    <div class="event-form-wrap">
        <div class="slds-media__body">
            <h2 class="slds-card__header-title slds-text-heading_small">Event Information</h2>

            <div class="slds-p-around_medium">
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-box event-box slds-size_1-of-1 slds-grid slds-wrap slds-gutters_small">

                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label="Event Name" name="Name" value={eventDetail.Name}
                                onchange={handleInputChange} required>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label="Event Type" name="Type__c" value={eventDetail.Type__c}
                                onchange={handleInputChange} placeholder="Conference, Workshop, Webinar, etc." required
                                field-level-help="Type of event — e.g., Conference, Workshop, Webinar. Helps categorize events for search and filtering.">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label="Location" name="Location__c" value={eventDetail.Location__c}
                                onchange={handleInputChange} title="Enter the city, venue name, or 'Online' if virtual."
                                field-level-help="Specify the city, hall, or online platform (e.g., Zoom).">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label="Venue" name="Venue__c" value={eventDetail.Venue__c} required
                                onchange={handleInputChange}
                                field-level-help="Provide the specific venue or room name (e.g., Hall A, Conference Room 2).">
                            </lightning-input>
                        </div>
                        <div class="file-upload-col slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input label="Upload Event Image" type="file" name="imageUpload"
                                accept={acceptedFormats} record-id={recordId} onuploadfinished={handleFileUpload}
                                onchange={handleFileUpload} title="Upload an event image (PNG, JPG).">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-combobox label="Status" name="Status__c" value={eventDetail.Status__c}
                                options={statusOptions} onchange={handleInputChange}
                                field-level-help="Set the event status (e.g., Draft, Published, Cancelled).">
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-1">
                            <span>Description</span>
                            <lightning-icon icon-name="utility:einstein" size="small" variant="success"
                                title="Click the Einstein icon to generate a description" onclick={handleIconClick}>
                            </lightning-icon>
                            <lightning-textarea label="Description" name="Description__c"
                                value={eventDetail.Description__c} onchange={handleInputChange} variant="label-hidden"
                                placeholder="Write a short description (max 300 chars)">
                            </lightning-textarea>
                        </div>
                        <template if:true={isSpinnerLoading}>
                            <lightning-spinner alternative-text="Generating description..."
                                size="small"></lightning-spinner>
                        </template>
                    </div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-p-top_medium slds-m-top_large slds-p-around_xx-small">
                <h3 class="slds-text-heading_small slds-m-bottom_small">Event Sessions</h3>
                <div class="slds-box event-box slds-size_1-of-1 slds-grid slds-wrap slds-gutters_small">
                    <lightning-accordion allow-multiple-sections-open active-section-name='Event Session 1'>
                        <template for:each={sessions} for:item="session" for:index="index">
                            <lightning-accordion-section name={accordingSectionName} label={accordingSectionName}
                                class="session-card" key={session.id} data-session-index={index}>
                                <div class="slds-grid slds-wrap slds-gutters">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input label="Session Name" name="sessionName"
                                            value={session.sessionName} data-index={index}
                                            onchange={handleSessionChange} required>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input label="Speaker" name="speaker" value={session.speaker}
                                            data-index={index} onchange={handleSessionChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input type="date" label="Start Date" name="startDate"
                                            value={session.startDate} data-index={index} min={minDateTime}
                                            onchange={handleSessionChange} required
                                            field-level-help="Select the session start date">
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input type="time" label="Start Time" name="startTime"
                                            value={session.startTime} data-index={index} onchange={handleSessionChange}
                                            required field-level-help="Select the session start time">
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input type="number" label="Duration (Hours)" name="duration"
                                            value={session.duration} data-index={index} onchange={handleSessionChange}
                                            required
                                            field-level-help="Enter the duration of the session in hours between 1 to 8">
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input label="Location" name="location" value={session.location}
                                            data-index={index} onchange={handleSessionChange}
                                            field-level-help="Enter the location of the session">
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input type="number" label="Price" name="price" min=0
                                            value={session.price} data-index={index} onchange={handleSessionChange}
                                            field-level-help="Enter the price for attending this session (in USD)">
                                        </lightning-input>
                                    </div>
                                </div>
                                <lightning-button-icon slot="actions" class="remove-session-btn"
                                    icon-name="utility:delete" variant="destructive" data-index={index}
                                    style="--sds-c-icon-color-foreground-default: red;" onclick={handleRemoveSession}>
                                </lightning-button-icon>
                            </lightning-accordion-section>
                        </template>
                    </lightning-accordion>
                    <div class="add-session-btn slds-m-top_medium" onclick={handleAddSession} role="button" tabindex="0"
                        onkeydown={handleKeyPress}>
                        <span class="plus-icon">+</span> Add Session
                    </div>
                </div>
            </div>
            <div class="slds-grid slds-m-top_medium slds-size_1-of-1">
                <div class="slds-col slds-text-align_right">
                    <lightning-button variant="brand" label="Register Event"
                        onclick={handleSaveEvent}></lightning-button>
                </div>
            </div>
            <template if:true={isLoading}>
                <div class="overlay">
                    <lightning-spinner alternative-text="Saving" size="large"></lightning-spinner>
                </div>
            </template>
        </div>
    </div>
</template>
