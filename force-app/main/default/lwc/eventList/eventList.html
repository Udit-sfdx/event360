<template>
    <div class="main-content">
        <div class="slds-p-around_medium">

            <template lwc:if={loading}>
                <div class="slds-m-top_medium slds-text-align_center">
                    <lightning-spinner alternative-text="Loading events" size="medium"></lightning-spinner>
                    <p class="loading-text">Fetching events, please wait...</p>
                </div>
            </template>

            <div slot="title"
                class="slds-grid slds-grid_vertical-align-center slds-align_absolute-center slds-m-bottom-x_small">
                <span
                    class="slds-p-left_x-small slds-p-right_medium event-heading slds-col slds-size__1-of-2 slds-text-align_right">Upcoming
                    Events</span>
                <span slot="actions" class="slds-col slds-size__1-of-2 slds-text-align_right slds-m-right_small">
                    <lightning-button-icon icon-name="utility:filterList" onclick={toggleFilterSection} variant="brand"
                        alternative-text="Filter" title="Toggle filter panel" style="--lwc-brandAccessible: #FF7F50;">
                    </lightning-button-icon>
                </span>
            </div>
            <template lwc:if={showFilterSection}>
                <div class="slds-p-around_small">
                    <div class="slds-box filter-box">
                        <lightning-layout multiple-rows="false" horizontal-align="spread" vertical-align="center"
                            pull-to-boundary="small" class="controls-layout">
                            <lightning-layout-item size="4" padding="around-small">
                                <div class="slds-m-bottom_x-small">
                                    <span class="slds-text-title_caps slds-text-title_bold">Pricing</span>
                                </div>

                                <lightning-button-stateful class='slds-m-right_small orangecolor' label-when-off="All"
                                    label-when-on="All" label-when-hover="All" data-name="all" selected={isAllSelected}
                                    onclick={handlePricingTypeClick} title="Show all events">
                                </lightning-button-stateful>

                                <lightning-button-stateful class='slds-m-right_small' label-when-off="Free"
                                    label-when-on="Free" label-when-hover="Free" data-name="free"
                                    selected={isFreeSelected} onclick={handlePricingTypeClick} title="Show free events">
                                </lightning-button-stateful>

                                <lightning-button-stateful label-when-off="Paid" label-when-on="Paid"
                                    label-when-hover="Paid" data-name="paid" selected={isPaidSelected}
                                    onclick={handlePricingTypeClick} title="Show paid events">
                                </lightning-button-stateful>
                            </lightning-layout-item>
                            <lightning-layout-item size="4" padding="around-small" class="search-name-col">
                                <div class="slds-m-bottom_x-small">
                                    <span class="slds-text-title_caps slds-text-title_bold">Event Name</span>
                                </div>
                                <lightning-input class="compact-input" type="search" name="searchName"
                                    label="Search Name" placeholder="Search by name" value={searchName}
                                    onkeyup={handleNameSearch} variant="label-hidden" icon-name="utility:search"
                                    aria-label="Search events by name">
                                </lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item size="4" padding="around-small" class="search-city-col">
                                <div class="slds-m-bottom_x-small">
                                    <span class="slds-text-title_caps slds-text-title_bold">Event City</span>
                                </div>
                                <lightning-input class="compact-input" type="search" name="searchCity"
                                    label="Search City" placeholder="Search by city" value={searchCity}
                                    onkeyup={handleCitySearch} variant="label-hidden" icon-name="utility:location"
                                    aria-label="Search events by city" disabled>
                                </lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>
            </template>
            <template lwc:if={hasEvents}>
                <div class="grid slds-m-top_large">
                    <template for:each={events} for:item="evt" for:index="idx">
                        <article class={evt.cardClass} key={evt.Id}>
                            <template if:true={evt.isTopRecommended}>
                                <div class="recommended-ribbon" title="Most recommended">
                                    <lightning-icon icon-name="utility:favorite" size="x-small"
                                        alternative-text="Recommended"></lightning-icon>
                                    <span>Most Recommended</span>
                                </div>
                            </template>

                            <template if:true={evt.isPopular}>
                                <div class="recommended-ribbon" title="Most popular">
                                    <lightning-icon icon-name="utility:favorite" size="x-small"
                                        alternative-text="Popular"></lightning-icon>
                                    <span>Most Popular</span>
                                </div>
                            </template>

                            <div class="image-wrapper" data-id={evt.Id} onclick={onDetailsHandler}
                                style="cursor:pointer;">
                                <img src={evt.imageUrl} alt={evt.Name} class="thumb" onerror={handleImageError} />
                                <div class="overlay">
                                    <span class="overlay-text">View Details</span>
                                </div>
                            </div>

                            <div class="card-body">
                                <div class="meta slds-grid slds-grid_vertical-align-center slds-wrap">
                                    <div class="event-date">{evt.formattedDateTime} Onwards</div>
                                </div>

                                <div>
                                    <h3 class="title">{evt.Name}</h3>
                                </div>

                                <div class="venue slds-grid slds-grid_vertical-align-center slds-wrap">
                                    <div>{evt.Venue}</div>
                                </div>

                                <div class="price slds-grid slds-grid_vertical-align-center slds-wrap">
                                    <div class="slds-p-bottom_large">{evt.displayPrice}</div>
                                </div>
                            </div>

                            <div class="card-footer slds-grid slds-grid_align-spread slds-align_absolute-center">
                                <template lwc:if={isGuestUser}>
                                    <lightning-button label="Book Tickets" data-id={evt.Id}
                                        onclick={onBookTicketsHandler} variant="brand"></lightning-button>
                                </template>
                                <lightning-button label="View Details" data-id={evt.Id} onclick={onDetailsHandler}
                                    variant="neutral"></lightning-button>
                            </div>
                        </article>
                    </template>
                </div>

                <template lwc:if={showMoreButton}>
                    <div class="slds-m-top_medium slds-text-align_center">
                        <div class="show-more-btn" onclick={showMore}>Show More</div>
                    </div>
                </template>
            </template>

            <template lwc:if={hasNoEvents}>

                <div class="no-results slds-m-top_large slds-text-align_center">
                    <template lwc:if={error}>
                        <div class="slds-text-color_error">{error}</div>
                    </template>
                    <template lwc:if={noError}>
                        <div class="slds-text-heading_small">🚫 No events found.</div>
                        <p class="slds-text-color_weak">Check back later for upcoming events.</p>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <template lwc:if={openModal}>
        <div class="custom-backdrop"></div>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_default slds-p-around_medium">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Book Your Seat</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" style="max-height:70vh; overflow:auto;">
                    <c-event-registration is-open={isOpen} event-id={selectedEventId}
                        onsendvalue={handleChildValue}></c-event-registration>
                </div>
            </div>
        </section>
    </template>
</template>
