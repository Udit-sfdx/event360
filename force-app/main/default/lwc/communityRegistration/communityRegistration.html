<template>
    <div class="registration-page slds-p-around_medium">
        <div class="registration-card slds-box slds-theme_default slds-p-around_medium slds-rounded_large">

            <div class="slds-media slds-media_center slds-m-bottom_medium card-header">
                <lightning-icon icon-name="standard:account" size="small" alternative-text="Organization Registration"></lightning-icon>
                <h1 class="slds-text-heading_medium slds-m-left_small">Organization Registration</h1>
            </div>

            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2 class="slds-text-body_regular">{error}</h2>
                </div>
            </template>

            <form class="slds-form" onsubmit={handleRegistration}>

                <!-- <div class="section-header slds-m-bottom_small">
                    <lightning-icon icon-name="standard:account" alternative-text="org" size="small"></lightning-icon>
                    <span class="section-title slds-m-left_x-small slds-text-title_bold">Organization</span>
                </div> -->

                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="text"
                            label="Organization Name"
                            name="accountName"
                            value={accountName}
                            onchange={handleInputChange}
                            required
                            field-level-help="Enter the legal name of your organization."
                            message-when-value-missing="Organization name is required.">
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input 
                                    label="Organization" 
                                    value="+91" 
                                    disabled
                                    required>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_2-of-3 slds-m-top_xx-small">
                                <lightning-input 
                                    type="tel" 
                                    name="accountPhone" 
                                    value={accountPhone}
                                    placeholder="Enter phone number"
                                    onchange={handleInputChange}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </div>
        
                <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="url"
                            label="Website"
                            name="accountWebsite"
                            value={accountWebsite}
                            onchange={handleInputChange}
                            placeholder="https://example.com">
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="text"
                            label="Address"
                            name="organisationAddress"
                            value={organisationAddress}
                            onchange={handleInputChange}>
                        </lightning-input>
                    </div>
                </div>

                <div>
                    <lightning-textarea
                        label="Description"
                        name="accountDescription"
                        value={accountDescription}
                        onchange={handleInputChange}
                        field-level-help="Provide a short description of your organization (optional)."
                        placeholder="Short description of your organization (optional)">
                    </lightning-textarea>
                </div>

                <div class="section-header slds-m-top_large slds-m-bottom_small">
                    <lightning-icon icon-name="standard:user" alternative-text="contact" size="small"></lightning-icon>
                    <span class="section-title slds-m-left_x-small slds-text-title_bold">Primary Contact</span>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="text"
                            label="First Name"
                            name="contactFirstName"
                            value={contactFirstName}
                            onchange={handleInputChange}
                            required
                            field-level-help="Enter the first name of the primary contact.">
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="text"
                            label="Last Name"
                            name="contactLastName"
                            value={contactLastName}
                            onchange={handleInputChange}
                            required
                            field-level-help="Enter the last name of the primary contact.">
                        </lightning-input>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_small slds-m-top_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="email"
                            label="Email"
                            name="contactEmail"
                            value={contactEmail}
                            onchange={handleInputChange}
                            onblur={validateEmail}
                            required
                            placeholder="abc@xyz.com"
                            message-when-value-missing="Email is required.">
                        </lightning-input>
                        <template if:true={emailError}>
                            <div class="slds-text-color_error slds-m-top_x-small">{emailError}</div>
                        </template>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-3">
                                <lightning-input 
                                    label="Personal" 
                                    value="+91" 
                                    disabled
                                    required
                                    field-level-help="Enter a 10-digit phone number where we can contact you for event updates.">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_2-of-3 slds-m-top_xx-small">
                                <lightning-input 
                                    type="tel" 
                                    name="contactPhone" 
                                    value={contactPhone}
                                    placeholder="Enter phone number"
                                    onchange={handleInputChange}>
                                </lightning-input>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            type="text"
                            label="Designation"
                            name="contactTitle"
                            value={contactTitle}
                            onchange={handleInputChange}
                            field-level-help="Mention the role or position of the contact person.">
                        </lightning-input>
                    </div>
                </div>

                <!-- <div class="slds-m-top_large slds-grid slds-justify_center slds-align_absolute-center">
                    <lightning-button
                        variant="brand"
                        label={submitLabel}
                        title="Register"
                        onclick={handleRegistration}
                        disabled={isSubmitDisabled}>
                    </lightning-button>

                    <template if:true={isSubmitting}>
                        <div class="spinner-wrap slds-m-left_small">
                            <lightning-spinner alternative-text="Submitting" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <lightning-button
                        variant="neutral"
                        label="Reset"
                        class="slds-m-left_small"
                        onclick={resetForm}>
                    </lightning-button>
                </div> -->
            </form>
        </div>
    </div>
</template>
